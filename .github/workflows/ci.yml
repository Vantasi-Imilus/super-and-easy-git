name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The test suite only needs undici and a git binary; --omit=dev skips the
      # ~250 MB Electron download so CI stays fast.
      - run: npm ci --omit=dev
      - name: Toolchain versions (helps interpret failures)
        run: |
          node --version
          git --version
      - run: npm test
