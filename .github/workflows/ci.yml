name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # The test suite only needs undici and a git binary; --omit=dev skips the
      # ~250 MB Electron download so CI stays fast.
      - run: npm ci --omit=dev
      - name: Toolchain versions (helps interpret failures)
        shell: bash
        run: |
          node --version
          git --version
          # Also emitted as annotations: readable from the checks API without log access.
          echo "::notice title=node::$(node --version)"
          echo "::notice title=git::$(git --version)"
      - name: Run tests (TAP output kept for annotations)
        id: tests
        shell: bash
        run: |
          set +e
          node --test "test/**/*.test.js" > test-output.tap 2>&1
          code=$?
          tail -40 test-output.tap
          exit $code
      # Surface every failing test (and its error line) as a check annotation,
      # so failures are readable without downloading the job log.
      - name: Annotate failing tests
        if: failure()
        shell: bash
        run: |
          awk '
            /^not ok/ { name = substr($0, 10); looking = 1; next }
            looking && /^  error:/ {
              line = $0
              sub(/^  error: /, "", line)
              print "::error title=" name "::" substr(line, 1, 400)
              looking = 0
            }
          ' test-output.tap | head -20 || true
